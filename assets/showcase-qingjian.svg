<svg xmlns="http://www.w3.org/2000/svg" width="580" height="320" viewBox="0 0 580 320">
  <defs>
    <linearGradient id="bg-qingjian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091811"/>
      <stop offset="100%" stop-color="#142c1f"/>
    </linearGradient>
    <linearGradient id="glow-qingjian" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="580" height="320" rx="12" fill="url(#bg-qingjian)" stroke="#1a3b2b" stroke-width="1.5"/>
  <rect x="0" y="0" width="580" height="320" rx="12" fill="url(#glow-qingjian)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="580" height="42" rx="12" fill="#0c2016" fill-opacity="0.8"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="76" y="26" font-family="ui-monospace, monospace" font-size="12" fill="#a7f3d0">qingjian · Rust Pinyin Input Engine</text>
  <rect x="465" y="10" width="95" height="22" rx="11" fill="#10b981" fill-opacity="0.25"/>
  <text x="512" y="25" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" font-weight="600" fill="#34d399">Rust Core</text>

  <!-- Candidate Floating Window Simulator -->
  <g transform="translate(45, 60)">
    <!-- Keystroke buffer -->
    <rect x="0" y="0" width="490" height="36" rx="6" fill="#163826" stroke="#25593c" stroke-width="1"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="14" fill="#6ee7b7">Input: <tspan fill="#ffffff" font-weight="700">qingjian|</tspan></text>
    <text x="470" y="23" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#a7f3d0">0.42 ms latency</text>

    <!-- Floating candidate box -->
    <rect x="0" y="48" width="490" height="135" rx="8" fill="#0d2419" stroke="#34d399" stroke-width="1.5"/>

    <!-- Candidate 1 (active) -->
    <rect x="8" y="56" width="474" height="36" rx="4" fill="#1b4731"/>
    <text x="24" y="80" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1. 青简</text>
    <text x="120" y="79" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#6ee7b7">qīng jiǎn</text>
    <rect x="230" y="65" width="235" height="20" rx="10" fill="#065f46"/>
    <text x="347" y="79" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#d1fae5">📖 bamboo slips; ancient writing</text>

    <!-- Candidate 2 -->
    <text x="24" y="116" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#cbd5e1">2. 清检</text>
    <text x="120" y="115" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#94a3b8">qīng jiǎn</text>
    <text x="240" y="115" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">clear inspection; audit</text>

    <!-- Candidate 3 -->
    <text x="24" y="152" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#cbd5e1">3. 请柬</text>
    <text x="120" y="151" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#94a3b8">qǐng jiǎn</text>
    <text x="240" y="151" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#94a3b8">invitation card</text>
  </g>

  <!-- Bottom highlights -->
  <g transform="translate(45, 260)">
    <rect x="0" y="0" width="490" height="42" rx="6" fill="#0d2419" stroke="#1f4e36" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#a7f3d0">⚡ Fully local n-gram trie</text>
    <text x="180" y="26" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#a7f3d0">🔒 Zero telemetry / private</text>
    <text x="360" y="26" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#a7f3d0">🎯 Spaced repetition hook</text>
  </g>
</svg>
