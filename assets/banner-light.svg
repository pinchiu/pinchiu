<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Pin Chiu — Computational Biology · AI Systems · Systems Software">
  <defs>
    <linearGradient id="grad-accent-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-glow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="0" width="600" height="220" rx="16" fill="url(#grad-glow-light)"/>

  <!-- Accent vertical bar -->
  <rect x="48" y="55" width="6" height="110" rx="3" fill="url(#grad-accent-light)"/>

  <!-- Name & Title -->
  <text x="76" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5" fill="#1f2328">Pin Chiu</text>
  <text x="78" y="146" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#59636e">
    <tspan fill="#0284c7">Computational Biology</tspan> · <tspan fill="#059669">AI Systems &amp; RAG</tspan> · <tspan fill="#7c3aed">Systems Software</tspan>
  </text>

  <!-- Sub-caption on right -->
  <text x="1140" y="146" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#656d76">github.com/pinchiu · open-source</text>

  <!-- Tech / Science Graphic Nodes (DNA & Neural Graph accents) -->
  <g stroke="url(#grad-accent-light)" stroke-width="1.75" opacity="0.65" fill="none">
    <!-- Abstract Helix / Node cluster -->
    <path d="M960,60 Q1000,110 1040,60 T1120,60" stroke-dasharray="4,4"/>
    <path d="M960,110 Q1000,60 1040,110 T1120,110"/>
    <line x1="980" y1="78" x2="980" y2="92"/>
    <line x1="1020" y1="88" x2="1020" y2="78"/>
    <line x1="1060" y1="78" x2="1060" y2="92"/>
    <line x1="1100" y1="88" x2="1100" y2="78"/>
    <!-- Circles for nodes -->
    <circle cx="960" cy="60" r="4" fill="#0284c7"/>
    <circle cx="1040" cy="60" r="4" fill="#059669"/>
    <circle cx="1120" cy="60" r="4" fill="#0284c7"/>
    <circle cx="960" cy="110" r="4" fill="#059669"/>
    <circle cx="1040" cy="110" r="4" fill="#0284c7"/>
    <circle cx="1120" cy="110" r="4" fill="#059669"/>
  </g>
</svg>
